spring.application.name=gigscore
spring.datasource.url=jdbc:mysql://localhost:3306/gigscore
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Rate limits (requests per minute per client IP).
rate.limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:10}
rate.limit.chat-per-minute=${RATE_LIMIT_CHAT_PER_MINUTE:20}

# Optional demo lender account (skipped when email/password are blank).
gigscore.seed-lender.email=${DEMO_LENDER_EMAIL:}
gigscore.seed-lender.password=${DEMO_LENDER_PASSWORD:}

# Swagger & OpenAPI documentation exposure (disabled by default in production)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

