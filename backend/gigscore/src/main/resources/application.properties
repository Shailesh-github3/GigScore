spring.application.name=gigscore
spring.datasource.url=jdbc:mysql://localhost:3306/gigscore
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Optional demo lender account (skipped when email/password are blank).
# gigscore.seed-lender.email=${DEMO_LENDER_EMAIL:}
# gigscore.seed-lender.password=${DEMO_LENDER_PASSWORD:}
